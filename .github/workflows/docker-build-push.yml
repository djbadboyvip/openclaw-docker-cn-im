name: Build and Push to GHCR

on:
  push:
    branches:
      - main          # 当 main 分支有推送时触发
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 2:00 检查上游更新并构建
  workflow_dispatch:       # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 允许写入 GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream (if needed)
        run: |
          git remote add upstream https://github.com/justlovemaki/OpenClaw-Docker-CN-IM.git
          git fetch upstream
          # 如果上游有更新，则合并
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse upstream/main)" ]; then
            echo "Upstream has new commits. Merging..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge upstream/main --no-edit
            # 如果合并冲突，可以选择保留本地版本（根据实际情况修改）
            # git checkout --ours <file> && git add <file>
          else
            echo "No upstream updates."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 使用自动生成的 token

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openclaw-cn-im:latest
            ghcr.io/${{ github.repository_owner }}/openclaw-cn-im:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
