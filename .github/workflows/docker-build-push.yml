name: Build and Push Docker Image

on:
  push:
    branches:
      - main   # 当 main 分支有推送时触发构建
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 2:00 检查上游更新并构建
  workflow_dispatch:       # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史以便比较

      - name: Sync with upstream (if needed)
        run: |
          git remote add upstream https://github.com/justlovemaki/OpenClaw-Docker-CN-IM.git
          git fetch upstream
          # 检查上游 main 分支是否有新提交
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse upstream/main)" ]; then
            echo "Upstream has new commits. Merging..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge upstream/main --no-edit
            # 如果合并有冲突，在此处可以加入自动解决冲突的逻辑（例如保留本地修改）
          else
            echo "No upstream updates."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/openclaw-cn-im:latest
            ${{ secrets.DOCKER_USERNAME }}/openclaw-cn-im:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
